name: Release SDK

# Manual trigger that dispatches the CircleCI release-sdk pipeline (run_release=true)
# and waits for it to finish. CircleCI does the actual work: validate -> bump version
# -> CHANGELOG -> tag -> GitHub Release -> npm publish (Trusted Publishing) -> PR to
# main (stables only). Mirrors the iOS/Android SDK release workflows.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 2.1.1 (stable, main only) or 2.1.1-beta.1 / 2.1.1-yinzcam.1 (prerelease from any branch, published under the npm dist-tag its suffix names)"
        required: true
        type: string
      release_notes:
        description: "Release notes (optional). If blank, generated from conventional commits."
        required: false
        type: string

# No step uses GITHUB_TOKEN, so grant it no scopes.
permissions: {}

jobs:
  trigger-release:
    # Stables come from main only. Prereleases can come from any branch (develop, or a
    # client build off a feature branch) and never move the npm `latest` tag.
    runs-on: ubuntu-latest
    env:
      CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
      CIRCLECI_PROJECT_SLUG: ${{ vars.CIRCLECI_PROJECT_SLUG }}
    steps:
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # The suffix's first identifier becomes the npm dist-tag, so it must start with a letter.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-zA-Z][a-zA-Z0-9]*(\.[a-zA-Z0-9]+)*)?$ ]]; then
            echo "::error::Version must be X.Y.Z or X.Y.Z-<tag>[.N], where <tag> starts with a letter (e.g., 2.1.1, 2.1.1-beta.1)"
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then
            dist_tag="${VERSION#*-}"
            if [ "${dist_tag%%.*}" = "latest" ]; then
              echo "::error::A prerelease can't be published under the 'latest' dist-tag"
              exit 1
            fi
          elif [ "$BRANCH" != "main" ]; then
            echo "::error::Stable releases can only be cut from main. Add a prerelease suffix (e.g., -beta.1) to release from $BRANCH."
            exit 1
          fi

      - name: Trigger CircleCI release pipeline
        id: trigger
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          BRANCH: ${{ github.ref_name }}
        run: |
          payload=$(jq -n \
            --arg branch "$BRANCH" \
            --arg version "$VERSION" \
            --arg notes "$RELEASE_NOTES" \
            '{
              branch: $branch,
              parameters: {
                run_release: true,
                release_version: $version,
                release_notes: $notes
              }
            }')

          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://circleci.com/api/v2/project/${CIRCLECI_PROJECT_SLUG}/pipeline" \
            -H "Circle-Token: ${CIRCLECI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload")

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')

          echo "$body" | jq . 2>/dev/null || echo "$body"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::CircleCI API returned HTTP $http_code"
            exit 1
          fi

          pipeline_id=$(echo "$body" | jq -r '.id')
          pipeline_number=$(echo "$body" | jq -r '.number')
          if [ -z "$pipeline_id" ] || [ "$pipeline_id" = "null" ]; then
            echo "::error::Could not extract pipeline ID from CircleCI response"
            exit 1
          fi

          echo "pipeline_id=$pipeline_id" >> "$GITHUB_OUTPUT"
          echo "pipeline_number=$pipeline_number" >> "$GITHUB_OUTPUT"
          echo "CircleCI pipeline triggered for version $VERSION (pipeline: $pipeline_number)"

      - name: Wait for CircleCI pipeline to complete
        env:
          PIPELINE_ID: ${{ steps.trigger.outputs.pipeline_id }}
          PIPELINE_NUMBER: ${{ steps.trigger.outputs.pipeline_number }}
        run: |
          pipeline_id="$PIPELINE_ID"
          pipeline_number="$PIPELINE_NUMBER"
          poll_interval=30
          timeout=2700  # 45 minutes
          elapsed=0

          echo "Waiting for CircleCI pipeline $pipeline_number to complete..."
          echo "Pipeline URL: https://app.circleci.com/pipelines/${CIRCLECI_PROJECT_SLUG}/${pipeline_number}"

          while [ "$elapsed" -lt "$timeout" ]; do
            api_response=$(curl -s -w "\n%{http_code}" -X GET \
              "https://circleci.com/api/v2/pipeline/${pipeline_id}/workflow" \
              -H "Circle-Token: ${CIRCLECI_TOKEN}" \
              -H "Content-Type: application/json")

            http_code=$(echo "$api_response" | tail -1)
            response=$(echo "$api_response" | sed '$d')

            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "::error::CircleCI API returned HTTP $http_code while polling workflows"
              echo "$response"
              exit 1
            fi

            workflow_count=$(echo "$response" | jq '.items | length')

            if [ "$workflow_count" -eq 0 ]; then
              echo "No workflows found yet, waiting..."
              sleep "$poll_interval"
              elapsed=$((elapsed + poll_interval))
              continue
            fi

            all_terminal=true
            any_failed=false
            summary=""

            for i in $(seq 0 $((workflow_count - 1))); do
              name=$(echo "$response" | jq -r ".items[$i].name")
              status=$(echo "$response" | jq -r ".items[$i].status")
              wf_id=$(echo "$response" | jq -r ".items[$i].id")
              summary="${summary}  - ${name}: ${status} (https://app.circleci.com/pipelines/${CIRCLECI_PROJECT_SLUG}/${pipeline_number}/workflows/${wf_id})\n"

              case "$status" in
                success) ;;
                failed|error|canceled|unauthorized)
                  any_failed=true
                  ;;
                *)
                  all_terminal=false
                  ;;
              esac
            done

            if [ "$all_terminal" = true ]; then
              echo ""
              echo "All workflows finished:"
              echo -e "$summary"

              if [ "$any_failed" = true ]; then
                echo "::error::One or more CircleCI workflows did not succeed"
                exit 1
              else
                echo "All CircleCI workflows completed successfully!"
                exit 0
              fi
            fi

            echo "[$(date -u +%H:%M:%S)] Workflows still running (${elapsed}s elapsed)..."
            echo -e "$summary"
            sleep "$poll_interval"
            elapsed=$((elapsed + poll_interval))
          done

          echo "::error::Timed out after ${timeout}s waiting for CircleCI pipeline to complete"
          exit 1
