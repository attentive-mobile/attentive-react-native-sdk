AttentiveReactNativeSdk_kotlinVersion=1.7.0
AttentiveReactNativeSdk_minSdkVersion=21
AttentiveReactNativeSdk_targetSdkVersion=34
# 35, not 34: com.attentive:attentive-android-sdk (2.3.0) declares minCompileSdk=35 in its AAR
# metadata, so a host app that does not define rootProject.ext.compileSdkVersion cannot build
# this module at 34 at all. Leaving the old 34 here only turned that into a confusing
# CheckAarMetadataTask failure. Consumers on compileSdk 34 need to move to 35 for this release.
AttentiveReactNativeSdk_compileSdkVersion=35
AttentiveReactNativeSdk_ndkversion=21.4.7075529
